    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const initial = createInitialState();
          saveState(initial, false);
          return initial;
        }
        const parsed = JSON.parse(raw);
        const base = createInitialState();
        return {
          ...base,
          ...parsed,
          meta: {
            ...base.meta,
            ...(parsed.meta || {}),
            seoConfig: { ...base.meta.seoConfig, ...((parsed.meta && parsed.meta.seoConfig) || {}) }
          },
          identity: { ...base.identity, ...(parsed.identity || {}) },
          pages: { ...base.pages, ...(parsed.pages || {}) },
          analytics: { ...base.analytics, ...(parsed.analytics || {}) }
        };
      } catch (err) {
        console.error('Error loading state:', err);
        return createInitialState();
      }
    }

    function saveState(nextState = state, recordNotificationOnError = true) {
      let localSaved = false;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
        localSaved = true;
      } catch (err) {
        console.warn('Primary localStorage save failed, attempting compact retry:', err);
        try {
          const compactState = JSON.parse(JSON.stringify(nextState));
          if (Array.isArray(compactState.notifications) && compactState.notifications.length > 20) {
            compactState.notifications = compactState.notifications.slice(0, 20);
          }
          if (Array.isArray(compactState.auditLog) && compactState.auditLog.length > 25) {
            compactState.auditLog = compactState.auditLog.slice(0, 25);
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(compactState));
          localSaved = true;
        } catch (retryErr) {
          console.error('Storage save error:', retryErr);
        }
      }

      if (window.__firebaseSync && typeof window.__firebaseSync.push === 'function') {
        try {
          window.__firebaseSync.push(nextState);
        } catch (fbErr) {
          console.error('Firebase push error:', fbErr);
        }
      }

      if (!localSaved) {
        if (recordNotificationOnError && Array.isArray(nextState.notifications)) {
          const hasRecentSaveError = nextState.notifications.some(
            (n) => n && n.type === 'saveError' && !n.read && (Date.now() - new Date(n.createdAt).getTime() < 60000)
          );
          if (!hasRecentSaveError) {
            nextState.notifications.unshift({
              id: 'notif_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
              type: 'saveError',
              title: 'تنبيه مساحة التخزين المحلية',
              detail: 'تعذر الحفظ محلياً في المتصفح (قد تكون المساحة ممتلئة أو الرابط محلياً)، وتمت محاولة المزامنة السحابية.',
              createdAt: new Date().toISOString(),
              read: false
            });
            if (nextState.notifications.length > 100) {
              nextState.notifications.length = 100;
            }
          }
        }
        if (typeof showToast === 'function') {
          showToast('تعذر الحفظ محلياً في المتصفح (تحقق من المساحة أو الرابط)', 'warning');
        }
        return false;
      }

      return true;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const colors = type === 'error'
        ? 'border-rose-400/60 bg-rose-950/90 text-rose-100'
        : type === 'warning'
        ? 'border-amber-400/60 bg-amber-950/90 text-amber-100'
        : 'border-goldLux/60 bg-navyDeep/95 text-crispWhite';

      el.className = `pointer-events-auto glass-card border ${colors} px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-xs sm:text-sm font-semibold page-enter`;
      const iconName = type === 'error' ? 'alert-circle' : type === 'warning' ? 'alert-triangle' : 'check-circle-2';
      el.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 text-goldLux shrink-0"></i><span class="flex-1">${escapeHtml(message)}</span>`;
      container.appendChild(el);
      lucide.createIcons();

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        el.style.transition = 'all 0.3s ease';
        setTimeout(() => el.remove(), 300);
      }, 3600);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatMultiline(text) {
      return escapeHtml(text || '').replace(/\n/g, '<br />');
    }

    function buildSitemapXml() {
      const seoCfg = state.meta.seoConfig || {};
      const baseUrl = (state.meta.siteUrl || 'https://dhafran-alqudami.example').replace(/\/+$/, '');
      const lastmod = new Date().toISOString().slice(0, 10);
      const urls = state.pageOrder
        .map((id) => state.pages[id])
        .filter((p) => p && p.visible && p.inSitemap !== false && seoCfg.allowIndexing !== false && p.indexable !== false)
        .map((p) => {
          const loc = p.canonicalUrl || (baseUrl + (p.slug === '/' ? '/' : (p.slug || '')));
          return `  <url>\n    <loc>${escapeHtml(loc)}</loc>\n    <lastmod>${lastmod}</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>${p.id === 'home' ? '1.0' : '0.8'}</priority>\n  </url>`;
        }).join('\n');

      return `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls}\n</urlset>`;
    }

    function buildRobotsTxt() {
      const seoCfg = state.meta.seoConfig || {};
      const baseUrl = (state.meta.siteUrl || 'https://dhafran-alqudami.example').replace(/\/+$/, '');
      if (seoCfg.allowIndexing === false) {
        return `User-agent: *\nDisallow: /\nSitemap: ${baseUrl}/sitemap.xml`;
      }
      return `User-agent: *\nAllow: /\nDisallow: /admin.html\nSitemap: ${baseUrl}/sitemap.xml`;
    }

      const autoGenerateSitemap = document.getElementById('seo-auto-sitemap').checked;

      state.meta.seoConfig = {

    function downloadSeoFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: `${mimeType};charset=utf-8;` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      showToast(`تم تحميل ملف ${filename}`);
    }

    function movePageOrder(pageId, delta) {
      const idx = state.pageOrder.indexOf(pageId);
      const targetIdx = idx + delta;
      if (idx < 0 || targetIdx < 0 || targetIdx >= state.pageOrder.length) return;
      const copy = [...state.pageOrder];
      const [removed] = copy.splice(idx, 1);
      copy.splice(targetIdx, 0, removed);
      state.pageOrder = copy;
      saveState();
      renderAdminSection('pages_manager');
    }

    function togglePageVisibility(pageId) {
      if (pageId === 'home') {
        showToast('لا يمكن إخفاء الصفحة الرئيسية', 'warning');
        return;
      }
      state.pages[pageId].visible = !state.pages[pageId].visible;
      addAuditLog('تغيير حالة ظهور صفحة', state.pages[pageId].titleAr);
      saveState();
      renderAdminSection('pages_manager');
    }

        card.style.display = !q || hay.includes(q) ? '' : 'none';
      });

    function applyInputsToPageConfig(p, mode = 'published') {
      p.previousVersion = { ...p, previousVersion: null };
      p.status = mode;

      if (activeSettingsTab === 'content') {
        if (p.id === 'home') {
          if (document.getElementById('cfg-home-name-ar')) state.identity.nameAr = document.getElementById('cfg-home-name-ar').value.trim();
          if (document.getElementById('cfg-home-role-ar')) state.identity.roleAr = document.getElementById('cfg-home-role-ar').value.trim();
          if (document.getElementById('cfg-home-welcome-ar')) state.identity.welcomeAr = document.getElementById('cfg-home-welcome-ar').value;
          if (document.getElementById('cfg-home-tagline-ar')) state.identity.taglineAr = document.getElementById('cfg-home-tagline-ar').value.trim();
        } else if (p.id === 'about_me' && document.getElementById('cfg-aboutme-ar')) {
          state.identity.aboutMeAr = document.getElementById('cfg-aboutme-ar').value;
        } else if (p.id === 'about_us' && document.getElementById('cfg-aboutus-ar')) {
          state.identity.aboutUsAr = document.getElementById('cfg-aboutus-ar').value;
        } else if (p.id === 'privacy' && document.getElementById('cfg-privacy-ar')) {
          state.identity.privacyPolicyAr = document.getElementById('cfg-privacy-ar').value;
        } else {
          if (document.getElementById('cfg-page-title-ar')) p.titleAr = document.getElementById('cfg-page-title-ar').value.trim();
          if (document.getElementById('cfg-page-title-en')) p.titleEn = document.getElementById('cfg-page-title-en').value.trim();
        }
      } else if (activeSettingsTab === 'media' && document.getElementById('cfg-page-hero-img')) {
        p.heroImage = document.getElementById('cfg-page-hero-img').value.trim();
        if (p.id === 'home' && p.heroImage) state.identity.portraitUrl = p.heroImage;
      } else if (activeSettingsTab === 'design') {
        if (document.getElementById('cfg-page-accent')) p.accentColor = document.getElementById('cfg-page-accent').value;
        if (document.getElementById('cfg-page-bgtint')) p.bgTint = document.getElementById('cfg-page-bgtint').value;
      } else if (activeSettingsTab === 'motion' && document.getElementById('cfg-page-anim')) {
        p.animationStyle = document.getElementById('cfg-page-anim').value;
      } else if (activeSettingsTab === 'seo') {
        if (document.getElementById('cfg-seo-title-ar')) p.seoTitleAr = document.getElementById('cfg-seo-title-ar').value.trim();
        if (document.getElementById('cfg-seo-slug')) p.slug = document.getElementById('cfg-seo-slug').value.trim();

    function uploadMediaFile(e) {
      e.preventDefault();
      const fileInput = document.getElementById('med-file-input');
      const titleInput = document.getElementById('med-title-input');
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        addNotification('uploadError', 'لم يتم اختيار ملف', 'يرجى اختيار صورة أو ملف قبل الضغط على رفع.');
        showToast('يرجى اختيار ملف أولاً', 'warning');
        return;
      }
      if (file.size > 2.5 * 1024 * 1024) {
        addNotification('uploadError', 'حجم الملف كبير', `الملف ${file.name} يتجاوز الحد المسموح للمعاينة المحلية.`);
        showToast('حجم الملف كبير جداً للمعاينة المحلية (الحد ~2.5MB)', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        state.mediaLibrary.unshift({
          id: 'med_' + Date.now(),
          title: titleInput.value.trim() || file.name,
          altText: titleInput.value.trim() || file.name,
          category: 'upload',
          url: reader.result,
          mimeType: file.type,
          sizeLabel: `${Math.round(file.size / 1024)} KB`,
          rotation: 0,
          position: 'center',
          createdAt: new Date().toISOString()
        });
        addAuditLog('رفع ملف إلى المكتبة', file.name);
        saveState();
        renderAdminSection('media_library');
        showToast('تم رفع الملف إلى المكتبة');
      };
      reader.readAsDataURL(file);
    }

    function rotateMediaItem(id, deg) {
      const item = state.mediaLibrary.find((m) => m.id === id);
      if (!item) return;
      item.rotation = ((item.rotation || 0) + deg) % 360;
      saveState();
      renderAdminSection('media_library');
    }

    function setMediaAsPortrait(id) {
      const item = state.mediaLibrary.find((m) => m.id === id);
      if (!item) return;
      state.identity.portraitUrl = item.url;
      if (state.pages.home) state.pages.home.heroImage = item.url;
      addAuditLog('تعيين صورة من المكتبة كصورة شخصية', item.title);
      saveState();
      showToast('تم تحديث الصورة الشخصية في الموقع');
    }

    function createNewCvVersion() {
      const name = prompt('أدخل اسم نسخة السيرة الذاتية الجديدة:');
      if (!name || !name.trim()) return;
      const newId = 'cv_' + Date.now();
      state.cvVersions.push({
        id: newId,
        nameAr: name.trim(),
        nameEn: name.trim(),
        includePortrait: true,
        sectionsOrder: ['identity', 'about', 'skills', 'experience', 'portfolio', 'achievements', 'certificates', 'languages', 'hobbies', 'custom'],
        visibleSections: {
          identity: true, about: true, skills: true, experience: true,
          portfolio: true, achievements: true, certificates: true, languages: true, hobbies: true, custom: true
        },
        languages: [{ id: 'lang_ar', nameAr: 'العربية', nameEn: 'Arabic', levelAr: 'اللغة الأم', levelEn: 'Native' }],
        hobbies: [],
        customSections: []
      });

      saveState();
      renderAdminSection('cv_manager');
      showToast('تم إنشاء النسخة الجديدة');

    function saveCvVersionEdits(id) {
      const cv = state.cvVersions.find((v) => v.id === id);
      if (!cv) return;
      cv.includePortrait = document.getElementById('cv-include-portrait').checked;
      document.querySelectorAll('.cv-sec-toggle').forEach((chk) => {
        const sec = chk.getAttribute('data-sec');
        cv.visibleSections[sec] = chk.checked;
      });

      const langVal = document.getElementById('cv-add-lang').value.trim();
      if (langVal) {
        cv.languages.push({ id: 'lang_' + Date.now(), nameAr: langVal, nameEn: langVal, levelAr: '', levelEn: '' });
      }
      const hobbyVal = document.getElementById('cv-add-hobby').value.trim();
      if (hobbyVal) {
        cv.hobbies.push({ ar: hobbyVal, en: hobbyVal });
      }
      const cTitle = document.getElementById('cv-custom-title').value.trim();
      const cBody = document.getElementById('cv-custom-body').value.trim();
      if (cTitle && cBody) {
        cv.customSections.push({ id: 'cs_' + Date.now(), titleAr: cTitle, titleEn: cTitle, contentAr: cBody, contentEn: cBody });
      }

      addAuditLog('تحديث نسخة السيرة الذاتية', cv.nameAr);
      saveState();
      renderAdminSection('cv_manager');
      showToast('تم حفظ تعديلات السيرة الذاتية');
    }

    function exportFollowersCsv() {

      const a = document.createElement('a');
      a.href = url;
      a.download = 'followers-dhafran-alqudami.csv';

    function exportFullBackupJson() {
      const jsonStr = JSON.stringify(state, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dhafran-alqudami-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      addAuditLog('تصدير نسخة احتياطية JSON', 'النظام الكامل');
      showToast('تم تحميل النسخة الاحتياطية JSON');
    }

    function importBackupJson(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || !parsed.identity || !parsed.pages) {
            throw new Error('Invalid backup structure');
          }
          state = parsed;
          saveState();
          addAuditLog('استعادة نسخة احتياطية JSON', file.name);
          renderAdminSection('backup_restore');
          showToast('تمت استعادة النسخة الاحتياطية بنجاح');
        } catch (_) {
          showToast('ملف النسخة الاحتياطية غير صالح', 'error');
        }
      };
      reader.readAsText(file);
    }

          <div class="flex justify-end gap-3">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-white/10 text-xs font-bold">إلغاء</button>
            <button onclick="executeFactoryReset()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold">تأكيد إعادة الضبط</button>
          </div>

  <!-- Firebase Realtime Database Sync -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCmNPKajRkfJZ1_7Ppd5nmjw-ZRdFPL5DQ",
      authDomain: "dhafran-portfolio.firebaseapp.com",
      databaseURL: "https://dhafran-portfolio-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dhafran-portfolio",
      storageBucket: "dhafran-portfolio.firebasestorage.app",
      messagingSenderId: "725131298783",
      appId: "1:725131298783:web:2fd939e126ff2c9fa3266a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const stateRef = ref(db, 'dhafran_alqudami_platform_v1');

    window.__firebaseSync = {
      initialized: false,
      pushing: false,
      push(data) {
        if (!this.initialized) return;
        this.pushing = true;
        set(stateRef, JSON.parse(JSON.stringify(data)))
          .catch((err) => console.error('Firebase write error:', err))
          .finally(() => { this.pushing = false; });
      }
    };

    (async () => {
      try {
        const snap = await get(stateRef);
        if (snap.exists() && snap.val()) {
          const remoteStr = JSON.stringify(snap.val());
          if (localStorage.getItem('dhafran_alqudami_platform_v1') !== remoteStr) {
            localStorage.setItem('dhafran_alqudami_platform_v1', remoteStr);
            if (typeof window.__applyRemoteFirebaseState === 'function') {
              window.__applyRemoteFirebaseState();
            }
          }
        } else {
          const localRaw = localStorage.getItem('dhafran_alqudami_platform_v1');
          if (localRaw) {
            await set(stateRef, JSON.parse(localRaw));
          }
        }
      } catch (err) {
        console.error('Firebase initial sync error:', err);
      } finally {
        window.__firebaseSync.initialized = true;
      }

      onValue(stateRef, (snapshot) => {
        if (!snapshot.exists() || !snapshot.val() || window.__firebaseSync.pushing) return;
        const remoteStr = JSON.stringify(snapshot.val());
        if (localStorage.getItem('dhafran_alqudami_platform_v1') !== remoteStr) {
          localStorage.setItem('dhafran_alqudami_platform_v1', remoteStr);
          if (typeof window.__applyRemoteFirebaseState === 'function') {
            window.__applyRemoteFirebaseState();
          }
        }
      });
    })();
  </script>
